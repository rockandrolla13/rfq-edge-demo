[project]
name = "rfq-edge"
version = "0.1.0"
description = "Edge-consistent RFQ responder demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
demo = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
